# Docker Compose configuration for Eidolon Character Generator Server
# Default stack: combined API + PostgreSQL container, plus Caddy.
# Usage: docker compose --env-file .env up -d

services:
  eidolon:
    build:
      context: .
      dockerfile: docker/eidolon/Dockerfile
    container_name: eidolon
    restart: unless-stopped
    environment:
      POSTGRES_USER: eidolon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: eidolon
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://eidolon:${DB_PASSWORD}@127.0.0.1:5432/eidolon
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_AUTH_ENABLED: ${RATE_LIMIT_AUTH_ENABLED:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-40}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-https://api.eidolonsimulacra.com}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    expose:
      - "3001"
    ports:
      - "3001:3001"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/api/health > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - eidolon-network

  caddy:
    image: caddy:2-alpine
    container_name: eidolon-caddy
    restart: unless-stopped
    environment:
      EIDOLON_DOMAIN: ${EIDOLON_DOMAIN:-api.eidolonsimulacra.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      eidolon:
        condition: service_healthy
    networks:
      - eidolon-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  eidolon-network:
    driver: bridge
