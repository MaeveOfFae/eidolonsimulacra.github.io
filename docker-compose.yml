# Docker Compose configuration for Eidolon Character Generator Server
# Usage: docker compose up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: eidolon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eidolon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: eidolon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eidolon -d eidolon"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eidolon-network

  # Backend API Server
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: eidolon-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://eidolon:${DB_PASSWORD}@postgres:5432/eidolon
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_AUTH_ENABLED: ${RATE_LIMIT_AUTH_ENABLED:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-40}
      # OAuth - Google
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      # OAuth - GitHub
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      # Email (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # OAuth redirect base
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-https://your-domain.com}
    ports:
      - "3001:3001"
    networks:
      - eidolon-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (optional - if serving from Docker)
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: eidolon-web
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - eidolon-network
    profiles:
      - full

  # Caddy Reverse Proxy (automatic HTTPS)
  caddy:
    image: caddy:alpine
    container_name: eidolon-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    networks:
      - eidolon-network
    profiles:
      - production

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  eidolon-network:
    driver: bridge
