# Keeps the shipped dependency trees current without anyone reading release notes.
# Pairs with `pnpm audit:check`, which fails the build when a production advisory
# reaches the web/shared bundles (see tools/generation/check-dependency-audit.mjs).
version: 2

updates:
  # The pnpm workspace (root + packages/*). Dependabot reads pnpm-lock.yaml
  # through the npm ecosystem.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR a week for routine bumps; majors stay individual so a breaking
      # change is reviewed on its own.
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # The Expo SDK, React Native and their packages have to move together, and a
      # lone major bump cannot be applied safely. Minors and patches still flow,
      # which is where the security fixes land.
      - dependency-name: 'expo*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday

  # The desktop shell's Rust manifest is hand-maintained, so it is safe to bump.
  - package-ecosystem: cargo
    directory: '/packages/web/src-tauri'
    schedule:
      interval: weekly
      day: monday

  # `packages/mobile/android` is generated by `expo prebuild` and rewritten from
  # app.json, so Gradle PRs there would be overwritten. Native dependency currency
  # follows the Expo SDK instead.
