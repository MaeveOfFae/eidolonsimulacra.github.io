[package]
name = "eidolon-simulacra-desktop"
version = "4.5.0"
description = "Desktop runtime for Eidolon Simulacra"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
if-addrs = "0.13"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
