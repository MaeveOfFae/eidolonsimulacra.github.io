# Docker Compose configuration for web preview and web development.
# Usage: docker compose -f docker-compose.web.yml up -d --build

services:
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: preview
    container_name: eidolon-web
    restart: unless-stopped
    ports:
      - "3000:3000"

  web-dev:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: dev
    container_name: eidolon-web-dev
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3100:3100"
    volumes:
      - .:/app
      - web_root_node_modules:/app/node_modules
      - web_package_node_modules:/app/packages/web/node_modules
      - shared_package_node_modules:/app/packages/shared/node_modules

volumes:
  web_root_node_modules:
  web_package_node_modules:
  shared_package_node_modules: