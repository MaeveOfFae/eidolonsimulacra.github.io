# Docker Compose configuration for development
# Usage: docker compose -f docker-compose.dev.yml up -d

services:
  # PostgreSQL Database (only)
  postgres:
    image: postgres:16-alpine
    container_name: eidolon-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: eidolon
      POSTGRES_PASSWORD: eidolon
      POSTGRES_DB: eidolon
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eidolon -d eidolon"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
