[template]
name = "Avatar Legends"
version = "1.0"
description = "Avatar Legends character template: playbook, concepts, and balance sheet, backstory, and an in-fiction opening scene."

[[assets]]
name = "avatar_character_sheet"
required = true
depends_on = []
description = "Playbook, concept, training, and background"
blueprint_file = "blueprints/templates/avatar_legends/assets/avatar_character_sheet.md"

[[assets]]
name = "avatar_stat_block"
required = true
depends_on = [
    "avatar_character_sheet",
]
description = "Stats, balance track, Fatigue, and playbook moves"
blueprint_file = "blueprints/templates/avatar_legends/assets/avatar_stat_block.md"

[[assets]]
name = "avatar_backstory"
required = true
depends_on = [
    "avatar_character_sheet",
]
description = "History, ties, and playable hooks"
blueprint_file = "blueprints/templates/avatar_legends/assets/avatar_backstory.md"

[[assets]]
name = "avatar_intro_scene"
required = true
depends_on = [
    "avatar_character_sheet",
    "avatar_stat_block",
    "avatar_backstory",
]
description = "In-fiction opening scene"
blueprint_file = "blueprints/templates/avatar_legends/assets/avatar_intro_scene.md"

[[assets]]
name = "a1111"
required = false
depends_on = [
    "avatar_character_sheet",
]
description = "Stable Diffusion image generation prompt"
blueprint_file = "blueprints/system/a1111.md"
