[template]
name = "Tales from the Loop"
version = "1.0"
description = "Tales from the Loop character template: kid concept sheet, rules-valid stat block, backstory, and an in-fiction opening scene."

[[assets]]
name = "tftl_character_sheet"
required = true
depends_on = []
description = "Kid type, age, and personality"
blueprint_file = "blueprints/templates/tales_from_the_loop/assets/tftl_character_sheet.md"

[[assets]]
name = "tftl_stat_block"
required = true
depends_on = [
    "tftl_character_sheet",
]
description = "Rules-valid stat block (attributes, skills, conditions, luck)"
blueprint_file = "blueprints/templates/tales_from_the_loop/assets/tftl_stat_block.md"

[[assets]]
name = "tftl_backstory"
required = true
depends_on = [
    "tftl_character_sheet",
]
description = "Backstory, relationships, and playable hooks"
blueprint_file = "blueprints/templates/tales_from_the_loop/assets/tftl_backstory.md"

[[assets]]
name = "tftl_intro_scene"
required = true
depends_on = [
    "tftl_character_sheet",
    "tftl_stat_block",
    "tftl_backstory",
]
description = "In-fiction opening scene"
blueprint_file = "blueprints/templates/tales_from_the_loop/assets/tftl_intro_scene.md"

[[assets]]
name = "a1111"
required = false
depends_on = [
    "tftl_character_sheet",
]
description = "Stable Diffusion image generation prompt"
blueprint_file = "blueprints/system/a1111.md"
