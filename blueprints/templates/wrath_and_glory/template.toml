[template]
name = "Wrath & Glory"
version = "1.0"
description = "Warhammer 40,000 Wrath & Glory character template: archetype sheet, rules-valid stat block, backstory, and an in-fiction opening scene."

[[assets]]
name = "wg_character_sheet"
required = true
depends_on = []
description = "Archetype, keyword, and personality"
blueprint_file = "blueprints/templates/wrath_and_glory/assets/wg_character_sheet.md"

[[assets]]
name = "wg_stat_block"
required = true
depends_on = [
    "wg_character_sheet",
]
description = "Rules-valid stat block (attributes, skills, wounds, dice pools)"
blueprint_file = "blueprints/templates/wrath_and_glory/assets/wg_stat_block.md"

[[assets]]
name = "wg_backstory"
required = true
depends_on = [
    "wg_character_sheet",
]
description = "Backstory, ties, and playable hooks"
blueprint_file = "blueprints/templates/wrath_and_glory/assets/wg_backstory.md"

[[assets]]
name = "wg_intro_scene"
required = true
depends_on = [
    "wg_character_sheet",
    "wg_stat_block",
    "wg_backstory",
]
description = "In-fiction opening scene"
blueprint_file = "blueprints/templates/wrath_and_glory/assets/wg_intro_scene.md"

[[assets]]
name = "a1111"
required = false
depends_on = [
    "wg_character_sheet",
]
description = "Stable Diffusion image generation prompt"
blueprint_file = "blueprints/system/a1111.md"
