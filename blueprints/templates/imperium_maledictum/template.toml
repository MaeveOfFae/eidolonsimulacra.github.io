[template]
name = "Imperium Maledictum"
version = "1.0"
description = "Warhammer 40,000 Imperium Maledictum character template: concept sheet, rules-valid stat block, backstory, and an in-fiction opening scene."

[[assets]]
name = "im_character_sheet"
required = true
depends_on = []
description = "Role, patron, faction, and personality"
blueprint_file = "blueprints/templates/imperium_maledictum/assets/im_character_sheet.md"

[[assets]]
name = "im_stat_block"
required = true
depends_on = [
    "im_character_sheet",
]
description = "Rules-valid stat block (characteristics, skills, wounds, gear)"
blueprint_file = "blueprints/templates/imperium_maledictum/assets/im_stat_block.md"

[[assets]]
name = "im_backstory"
required = true
depends_on = [
    "im_character_sheet",
]
description = "Backstory, ties, and playable hooks"
blueprint_file = "blueprints/templates/imperium_maledictum/assets/im_backstory.md"

[[assets]]
name = "im_intro_scene"
required = true
depends_on = [
    "im_character_sheet",
    "im_stat_block",
    "im_backstory",
]
description = "In-fiction opening scene"
blueprint_file = "blueprints/templates/imperium_maledictum/assets/im_intro_scene.md"

[[assets]]
name = "a1111"
required = false
depends_on = [
    "im_character_sheet",
]
description = "Stable Diffusion image generation prompt"
blueprint_file = "blueprints/system/a1111.md"
